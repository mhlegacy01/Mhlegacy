<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark">
<title>MH Legacy Productivity Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap');
/* Layout: sticky navy top bar, scrolling tab strip, then a single content column of cards (max 1180px).
   Navy = chrome and primary actions. Emerald = positive and achievement. Series colours = validated categorical set. */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#eef1f7; --ink:#0d1b34; --ink-2:#4a566b; --muted:#7a8699;
  --line:#dde3ed; --grid:#e6eaf1; --bar:#0f2a52; --primary:#0f2a52; --primary-2:#1b427c; --on-primary:#ffffff;
  --emerald:#0a8a66; --emerald-ink:#006a4d; --emerald-soft:#dff4ec;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --crit-ink:#b02a2a; --warn-ink:#8a5a00;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948;
  --shadow:0 1px 2px rgba(13,27,52,.06),0 4px 14px rgba(13,27,52,.05);
  --font:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1120; --surface:#121b2f; --surface-2:#18243d; --ink:#e9eff9; --ink-2:#b3bed1; --muted:#8996ab;
  --line:#25324e; --grid:#1f2a43; --bar:#0b1a36; --primary:#3b78d8; --primary-2:#5b92e6; --on-primary:#ffffff;
  --emerald:#2fc296; --emerald-ink:#46d3a8; --emerald-soft:#12332c;
  --crit-ink:#ee7a7a; --warn-ink:#f2bd4d;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0a1120; --surface:#121b2f; --surface-2:#18243d; --ink:#e9eff9; --ink-2:#b3bed1; --muted:#8996ab;
  --line:#25324e; --grid:#1f2a43; --bar:#0b1a36; --primary:#3b78d8; --primary-2:#5b92e6; --on-primary:#ffffff;
  --emerald:#2fc296; --emerald-ink:#46d3a8; --emerald-soft:#12332c;
  --crit-ink:#ee7a7a; --warn-ink:#f2bd4d;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:#fff;padding:10px 16px;min-height:58px;display:flex;align-items:center;gap:12px}
.logo{height:38px;width:auto;flex:none;display:block}
.biglogo{display:block;margin:0 auto 14px;height:96px;width:auto;background:var(--bar);border-radius:20px;padding:12px}
.top .brand{font-weight:700;letter-spacing:.01em;font-size:15px;line-height:1.2;flex:1;min-width:0}
.top .brand .bt{display:block}
.top .brand small{display:block;font-weight:500;opacity:.72;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.role{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border:1px solid rgba(255,255,255,.4);border-radius:999px}
.bell{position:relative;background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:5px 9px;cursor:pointer}
.bell b{position:absolute;top:-6px;right:-6px;background:var(--emerald);color:#fff;border-radius:999px;font-size:10px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.tabs{display:flex;gap:2px;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--line);padding:0 12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:19;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:12px 12px 9px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--emerald)}
.tab:focus-visible,.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,tr[data-open]:focus-visible{outline:2px solid var(--primary-2);outline-offset:2px}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px;display:flex;flex-direction:column;gap:16px}
.pagehead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between}
.pagehead h1{font-size:22px;font-weight:700}
.pagehead p{margin:4px 0 0;color:var(--ink-2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:15px;font-weight:650;margin-bottom:2px}
.card .sub{color:var(--muted);font-size:12px;margin-bottom:12px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.grid.wide{grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0;box-shadow:var(--shadow)}
.kpi .l{font-size:12px;color:var(--ink-2);font-weight:600}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px;overflow-wrap:anywhere}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.ut{border-top:3px solid var(--c1)} .kpi.tk{border-top:3px solid var(--c3)} .kpi.rc{border-top:3px solid var(--c4)} .kpi.tm{border-top:3px solid var(--primary-2)}
.sec{display:flex;align-items:center;gap:10px;margin-top:6px}
.sec h2{font-size:17px;font-weight:700}
.sec .tag{font-size:11px;font-weight:600;color:var(--ink-2);background:var(--surface-2);border-radius:999px;padding:2px 9px}
.notice{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--ink-2);font-size:12.5px}
.notice.warn{border-color:var(--warn);}
.btn{background:var(--primary);color:var(--on-primary);border:0;border-radius:9px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--primary-2)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.em{background:var(--emerald);color:#fff}
.btn.danger{background:transparent;color:var(--crit-ink);border:1px solid var(--line)}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:7px}
.btn[disabled]{opacity:.55;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--ink-2);min-width:0}
label.f.inline{flex-direction:row;align-items:center;gap:8px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%;font-weight:500}
input[type=checkbox],input[type=radio]{width:auto}
textarea{min-height:64px;resize:vertical}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.form .full{grid-column:1/-1}
.err{color:var(--crit-ink);font-size:12px;font-weight:600}
.hint{color:var(--muted);font-size:12px;font-weight:400}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--surface-2);text-align:left;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);padding:8px 10px;white-space:nowrap;position:sticky;top:0}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr[data-open]{cursor:pointer} tr[data-open]:hover td{background:var(--surface-2)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;border-radius:999px;padding:2px 9px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;display:inline-block}
.pill.hist{background:transparent;border:1px dashed var(--muted);color:var(--ink-2)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(80px,32%) 1fr auto;gap:10px;align-items:center;font-size:13px}
.bar .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2);font-weight:550}
.bar .t{background:var(--surface-2);border-radius:0 5px 5px 0;height:14px}
.bar .t i{display:block;height:100%;border-radius:0 4px 4px 0;min-width:2px}
.bar .v{font-weight:650;min-width:64px;text-align:right}
button.bar{background:none;border:0;padding:0;text-align:left;cursor:pointer;width:100%}
.donutwrap{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:center}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px;min-width:200px;flex:1}
.legend .li{display:grid;grid-template-columns:12px 1fr auto auto;gap:8px;align-items:center}
.legend .sw{width:12px;height:12px;border-radius:3px}
.legend .p{color:var(--muted);min-width:44px;text-align:right}
.lg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink-2);margin-bottom:8px}
.lg span{display:inline-flex;gap:6px;align-items:center}.lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .hit{fill:transparent}
.chart .hit:hover{fill:rgba(120,140,180,.14)}
.empty{text-align:center;padding:26px 12px;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.prog{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--emerald);border-radius:999px}
.prog i.over{background:var(--primary-2)}
.feed{display:flex;flex-direction:column}
.feed .it{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.feed .it:first-child{border-top:0}
.feed .dot{width:10px;height:10px;border-radius:50%;margin-top:5px}
.feed .m{color:var(--ink-2);font-size:12.5px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);font-weight:600}
.live i{width:8px;height:8px;border-radius:50%;background:var(--emerald);box-shadow:0 0 0 0 var(--emerald);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(10,138,102,.5)}70%{box-shadow:0 0 0 8px rgba(10,138,102,0)}100%{box-shadow:0 0 0 0 rgba(10,138,102,0)}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:7px;font-size:12px;max-width:260px;opacity:0;transition:opacity .08s;line-height:1.35}
#tip.on{opacity:1}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;width:calc(100% - 32px);max-width:420px;pointer-events:none}
#toast div{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:9px;font-weight:600;box-shadow:var(--shadow);width:100%}
#toast div.bad{background:var(--crit);color:#fff}
.veil{position:fixed;inset:0;background:rgba(6,12,26,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px 12px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;width:100%;max-width:640px;margin:auto 0}
.modal h2{font-size:17px;margin-bottom:12px}
.modal .acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:14px}
.panel{position:absolute;right:12px;top:56px;width:min(340px,calc(100% - 24px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px;z-index:30}
.gate{max-width:520px;margin:12vh auto;text-align:center;padding:0 16px}
.stepper{display:flex;gap:8px;flex-wrap:wrap}
.stepper .st{display:flex;gap:8px;align-items:center;background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:12.5px}
.rank-na{color:var(--muted)}
.mono{font-feature-settings:'tnum'}
@media (max-width:560px){.top .brand small{display:none}.top .brand{font-size:13.5px}.kpi .v{font-size:21px}.pagehead h1{font-size:20px}.bar{grid-template-columns:minmax(70px,34%) 1fr auto}}
.combowrap{display:flex;flex-direction:column;gap:4px;min-width:0;font-size:12px;font-weight:600;color:var(--ink-2)}.combo{display:flex;flex-wrap:wrap;gap:6px;max-height:112px;overflow-y:auto;padding:2px}.chip.sm{padding:4px 10px;font-size:12px}
</style>
<style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>

<script>
/* MH Legacy Productivity Dashboard: Supabase connector.
   Gives the app the same small database interface it used inside Claude (window.claude.use('db'|'user'|'downloads')),
   but talks to your own Supabase project over plain HTTPS. No external libraries.
   Live updates: the page checks for changes every few seconds (and when you return to the tab). */
(function(){
'use strict';
var CFG=window.MH_CONFIG||{};
var BASE=String(CFG.SUPABASE_URL||'').replace(/\/+$/,''),KEY=String(CFG.SUPABASE_ANON_KEY||'');
var POLL_MS=CFG.POLL_MS||4000,RESYNC_MS=60000,SKEY='mh_legacy_session_v1';
var session=null,readyRes,ready=new Promise(function(r){readyRes=r;});

/* ---------- small helpers ---------- */
function lsGet(){try{return JSON.parse(localStorage.getItem(SKEY)||'null');}catch(e){return null;}}
function lsSet(v){try{if(v)localStorage.setItem(SKEY,JSON.stringify(v));else localStorage.removeItem(SKEY);}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function mkErr(code,message){var e=new Error(message);e.code=code;return e;}
function nice(status,body){
  var m=body&&(body.msg||body.error_description||body.message||body.error)||'';
  if(body&&(body.code==='42501'||/row-level security|permission denied/i.test(m)))return mkErr('permission_denied','You do not have permission to do that.');
  if(status===401||status===403)return mkErr('revoked','Your session expired. Reload the page and sign in again.');
  return mkErr(String(body&&body.code||status||'network'),m||'Could not reach the server. Check your internet connection.');
}
function deepMerge(a,b){
  var o=JSON.parse(JSON.stringify(a||{}));
  Object.keys(b||{}).forEach(function(k){
    var v=b[k];
    if(v&&typeof v==='object'&&!Array.isArray(v)&&o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k]))o[k]=deepMerge(o[k],v);
    else o[k]=JSON.parse(JSON.stringify(v===undefined?null:v));
  });
  return o;
}

/* ---------- auth (Supabase GoTrue over REST) ---------- */
function authHeaders(bearer){var h={'apikey':KEY,'Content-Type':'application/json'};if(bearer)h.Authorization='Bearer '+bearer;else if(/^eyJ/.test(KEY))h.Authorization='Bearer '+KEY;return h;}
function authCall(path,body,bearer,method){
  return fetch(BASE+'/auth/v1'+path,{method:method||'POST',headers:authHeaders(bearer),body:body?JSON.stringify(body):undefined})
    .then(function(r){return r.text().then(function(t){var j=null;try{j=t?JSON.parse(t):null;}catch(e){}if(!r.ok)throw nice(r.status,j||{});return j||{};});},
      function(){throw mkErr('network','Could not reach the server. Check your internet connection.');});
}
function adopt(j){
  if(!j||!j.access_token)return null;
  var exp=j.expires_at?j.expires_at*1000:Date.now()+((j.expires_in||3600)*1000);
  session={access_token:j.access_token,refresh_token:j.refresh_token||'',expires_at:exp,user:{id:j.user&&j.user.id,email:j.user&&j.user.email}};
  lsSet(session);return session;
}
async function refresh(){
  if(!session||!session.refresh_token)throw mkErr('revoked','Session expired.');
  var j=await authCall('/token?grant_type=refresh_token',{refresh_token:session.refresh_token});
  if(!adopt(j))throw mkErr('revoked','Session expired.');
}
async function token(){
  if(!session)throw mkErr('revoked','Not signed in.');
  if(session.expires_at-Date.now()<60000){
    try{await refresh();}catch(e){if(e.code==='network')return session.access_token;signOutLocal();throw mkErr('revoked','Your session expired. Reload the page and sign in again.');}
  }
  return session.access_token;
}
function signOutLocal(){session=null;lsSet(null);}

/* ---------- REST for the docs table ---------- */
async function rest(method,qs,body,extra,retry){
  var t=await token();
  var h={'apikey':KEY,'Authorization':'Bearer '+t,'Content-Type':'application/json'};
  Object.keys(extra||{}).forEach(function(k){h[k]=extra[k];});
  var r;
  try{r=await fetch(BASE+'/rest/v1/docs'+qs,{method:method,headers:h,body:body?JSON.stringify(body):undefined});}
  catch(e){throw mkErr('network','Could not reach the server. Check your internet connection.');}
  if(r.status===401&&!retry){try{await refresh();}catch(e){signOutLocal();throw mkErr('revoked','Your session expired. Reload the page and sign in again.');}return rest(method,qs,body,extra,true);}
  var txt=await r.text(),j=null;try{j=txt?JSON.parse(txt):null;}catch(e){}
  if(!r.ok)throw nice(r.status,j||{});
  return j;
}
var enc=encodeURIComponent;
async function selectAll(filterQs){ /* pages of 1000 rows */
  var out=[],from=0;
  for(;;){
    var rows=await rest('GET','?'+filterQs,null,{'Range-Unit':'items','Range':from+'-'+(from+999)});
    rows=rows||[];out=out.concat(rows);
    if(rows.length<1000||out.length>=20000)break;
    from+=1000;
  }
  return out;
}
var lastId=function(p){return p.split('/').pop();};
var parentOf=function(p){var i=p.lastIndexOf('/');return i<0?'':p.slice(0,i);};

/* ---------- change hub: refreshes listeners when something changes ---------- */
var listeners=[],since=null,pollTimer=null,resyncAt=Date.now();
function sig(x){try{return JSON.stringify(x);}catch(e){return String(Math.random());}}
function startPolling(){
  if(pollTimer)return;
  pollTimer=setInterval(function(){if(!document.hidden)poll();},POLL_MS);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)poll(true);});
}
var polling=false;
async function poll(forceAll){
  if(polling||!session||!listeners.length)return;
  polling=true;
  try{
    if(since===null){var f=await rest('GET','?select=updated_at&order=updated_at.desc&limit=1');since=f&&f[0]?f[0].updated_at:'1970-01-01T00:00:00+00:00';}
    var back=new Date(Date.parse(since)-8000).toISOString(); /* overlap so late commits are not missed */
    var rows=await selectAll('select=path,updated_at&updated_at=gt.'+enc(back)+'&order=updated_at.asc');
    if(rows.length)since=rows[rows.length-1].updated_at>since?rows[rows.length-1].updated_at:since;
    var full=forceAll||Date.now()-resyncAt>RESYNC_MS;if(full)resyncAt=Date.now();
    var paths={},parents={};rows.forEach(function(r){paths[r.path]=1;parents[parentOf(r.path)]=1;});
    await Promise.all(listeners.slice().map(function(l){
      if(full||(l.kind==='doc'?paths[l.path]:parents[l.path]))return l.refetch();
    }));
  }catch(e){listeners.forEach(function(l){if(l.err&&e&&e.code==='revoked')l.err(e);});}
  polling=false;
}
function touchListeners(path){ /* after our own write: refresh matching listeners right away */
  listeners.slice().forEach(function(l){if(l.kind==='doc'?l.path===path:l.path===parentOf(path))l.refetch();});
}

/* ---------- document and collection objects ---------- */
function docSnap(path,row){var has=!!row;return {id:lastId(path),exists:has,data:function(){return has?JSON.parse(JSON.stringify(row.data)):undefined;},metadata:{}};}
function doc(path){
  return {id:lastId(path),path:path,
    get:async function(){var rows=await rest('GET','?select=path,data&path=eq.'+enc(path));return docSnap(path,rows&&rows[0]);},
    set:async function(d){await rest('POST','?on_conflict=path',{path:path,data:d||{}},{'Prefer':'resolution=merge-duplicates,return=minimal'});touchListeners(path);},
    update:async function(d){
      var rows=await rest('GET','?select=path,data&path=eq.'+enc(path));
      if(!rows||!rows[0])throw mkErr('not_found','That record no longer exists.');
      await rest('POST','?on_conflict=path',{path:path,data:deepMerge(rows[0].data,d)},{'Prefer':'resolution=merge-duplicates,return=minimal'});
      touchListeners(path);
    },
    delete:async function(){await rest('DELETE','?path=eq.'+enc(path),null,{'Prefer':'return=minimal'});touchListeners(path);},
    acquire:async function(){return {acquired:true};}, /* uniqueness is enforced by the database primary key + access rules */
    collection:function(c){return col(path+'/'+c);},
    onSnapshot:function(next,err){
      var last=null,dead=false;
      var l={kind:'doc',path:path,err:err,refetch:async function(){
        if(dead)return;
        try{var rows=await rest('GET','?select=path,data&path=eq.'+enc(path));var row=rows&&rows[0];var s=sig(row&&row.data);if(s!==last){last=s;if(!dead)next(docSnap(path,row));}}
        catch(e){if(err&&!dead)err(e);}
      }};
      listeners.push(l);startPolling();l.refetch();
      return function(){dead=true;listeners=listeners.filter(function(x){return x!==l;});};
    }};
}
function col(path){
  return {path:path,
    doc:function(id){return doc(path+'/'+(id||('x'+Math.random().toString(36).slice(2))));},
    get:async function(){var rows=await selectAll('select=path,data&parent=eq.'+enc(path)+'&order=path.asc');return mkSnap(rows,null);},
    onSnapshot:function(next,err){
      var last=null,prev=new Set(),dead=false;
      var l={kind:'col',path:path,err:err,refetch:async function(){
        if(dead)return;
        try{var rows=await selectAll('select=path,data&parent=eq.'+enc(path)+'&order=path.asc');var s=sig(rows);
          if(s!==last){last=s;var snap=mkSnap(rows,prev);prev=new Set(rows.map(function(r){return lastId(r.path);}));if(!dead)next(snap);}}
        catch(e){if(err&&!dead)err(e);}
      }};
      listeners.push(l);startPolling();l.refetch();
      return function(){dead=true;listeners=listeners.filter(function(x){return x!==l;});};
    }};
}

    '<button class="btn" id="a_go" type="submit" style="width:100%">'+(forgot?'Send reset link':signup?'Create account':'Sign in')+'</button></form>'+
    '<p style="margin:14px 0 0;text-align:center;font-size:13.5px">'+

    var p={};h.split('&').forEach(function(kv){var i=kv.indexOf('=');if(i>0)p[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1).replace(/\+/g,' '));});
    if(p.type==='recovery')return showReset(p.access_token);

  }

<script>
(function(){

/* ---------- state ---------- */

/* ---------- periods ---------- */
function periodRange(p){
  const t=new Date(),to=ymd(t),y=t.getFullYear();
  if(p.k==='today')return {from:to,to};
  if(p.k==='week'){const d=new Date(t);d.setDate(d.getDate()-((d.getDay()+6)%7));return {from:ymd(d),to};}
  if(p.k==='month')return {from:y+'-'+pad(t.getMonth()+1)+'-01',to};
  if(p.k==='custom'){let f=p.from||y+'-01-01',e=p.to||to;if(f>e){const x=f;f=e;e=x;}return {from:f,to:e};}
  return {from:y+'-01-01',to};
}

function monthsTouched(r){const out=[];let [y,m]=r.from.split('-').map(Number);const [ey,em]=r.to.split('-').map(Number);let g=0;while((y<ey||(y===ey&&m<=em))&&g++<60){out.push(y+'-'+pad(m));m++;if(m>12){m=1;y++;}}return out;}

function rowsOf(uids,module,r){

}
function utStats(rows,r){
  /* Rejected submissions are listed by status but excluded from every sales total. */
  const s={n:0,nAll:rows.length,total:0,rsp:0,cat:{cash:0,epf:0,prs:0,rsp:0},catN:{cash:0,epf:0,prs:0,rsp:0},status:{Submit:{n:0,amt:0},Disbursed:{n:0,amt:0},Rejected:{n:0,amt:0}},fund:{},month:[],monthCat:{cash:[],epf:[],prs:[],rsp:[]},agent:{}};
  const mn=monthSpan(r);for(let i=0;i<mn;i++){s.month.push(0);for(const c in s.monthCat)s.monthCat[c].push(0);}
  for(const x of rows){
    const a=r2(x.amount),st=s.status[x.status];
    if(st){st.n++;st.amt=r2(st.amt+a);}
    if(x.status==='Rejected')continue;
    s.n++;s.total=r2(s.total+a);s.rsp=r2(s.rsp+r2(x.monthlyContribution));

  }

}

    const i=monthIdx(x.date,r);if(i>=0&&i<mn){s.mAc[i]=r2(s.mAc[i]+a);s.mCc[i]=r2(s.mCc[i]+c);}

function rcStats(rows,r){

/* ---------- charts (SVG built at the measured width) ---------- */

  return legendHtml(series)+chart(w=>{
    const ml=42,mr=6,mt=8,mb=22,iw=w-ml-mr,ih=h-mt-mb,n=labels.length;
    const tot=labels.map((_,i)=>stacked?series.reduce((a,s)=>a+(s.values[i]||0),0):Math.max.apply(null,series.map(s=>s.values[i]||0)));
    const max=niceMax(Math.max.apply(null,[0].concat(tot))),y=v=>mt+ih-(v/max)*ih;
    let g='';
    for(let k=0;k<=4;k++){const v=max*k/4,yy=y(v);g+='<line x1="'+ml+'" x2="'+(w-mr)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--grid)"/><text x="'+(ml-6)+'" y="'+(yy+4)+'" text-anchor="end">'+short(v)+'</text>';}

        series.forEach((s,k)=>{const v=s.values[i]||0;if(v<=0)return;
          const yt=y(cum+v),yb=y(cum),hh=Math.max(1,yb-yt-(k>0?1.5:0));
          g+=k===topIdx?'<path d="'+topRound(cx-bwid/2,yt,bwid,hh,4)+'" fill="'+s.color+'"/>':'<rect x="'+(cx-bwid/2)+'" y="'+yt+'" width="'+bwid+'" height="'+hh+'" fill="'+s.color+'"/>';
          cum+=v;});

      }

function lineChart({labels,values,color,fmt=rm,h=190,name=''}){

function donut(items,o){

    const tip='<b>'+esc(i.label)+'</b><br>'+fmt(i.value)+' ('+pct(i.value,tot).toFixed(1)+'%)';
    segs+='<circle cx="80" cy="80" r="'+r+'" fill="none" stroke="'+i.color+'" stroke-width="26" stroke-dasharray="'+d+' '+(C-d)+'" stroke-dashoffset="'+(-cum)+'" transform="rotate(-90 80 80)" data-tip="'+esc(tip)+'"/>';cum+=len;});
  const svg='<svg viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Donut chart" style="flex:none">'+segs+'<text x="80" y="76" text-anchor="middle" style="font-size:11px;fill:var(--muted)">'+esc(o.center||'Total')+'</text><text x="80" y="94" text-anchor="middle" style="font-size:'+(o.big||14)+'px;font-weight:700;fill:var(--ink)">'+esc(o.centerVal||(fmt===rm?'RM '+short(tot):fmt(tot)))+'</text></svg>';

async function sha(text){
  const s='lscc-v1|'+text;
  try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}}catch(e){}
  let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return 'f'+(h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0');
}

function kpiStrip(uids,r,p,agentCount){
  const ut=utStats(rowsOf(uids,'UT',r),r),tk=tkStats(rowsOf(uids,'TK',r),r),rc=rcStats(rowsOf(uids,'RC',r),r);
  const all=!p;let h='';
  if(all||hasRHB(p)||ut.n)h+=kpi('ut','Unit Trust investment sales',rm(ut.total),'Lump-sum, excludes RSP monthly')+kpi('ut','Unit Trust transactions',int(ut.n));
  if(all||hasHLMT(p)||tk.n)h+=kpi('tk','Takaful FYAC',rm(tk.fyac))+kpi('tk','Takaful FYCC',rm(tk.fycc))+kpi('tk','Takaful cases',int(tk.n),'Inforced '+tk.status.Inforced.n+' · Pending '+tk.status.Pending.n);
  if(all||hasRHB(p)||rc.cat.RHB)h+=kpi('rc','RHB recruitment',int(rc.cat.RHB));
  if(all||hasHLMT(p)||rc.cat.HLMT)h+=kpi('rc','HLMT recruitment',int(rc.cat.HLMT));
  if(agentCount){const act=new Set();for(const u of uids){for(const it of (S.items[u]||[]))if((it.module==='UT'||it.module==='TK'||it.module==='RC')&&it.date>=r.from&&it.date<=r.to){act.add(u);break;}}
    h+=kpi('tm','Registered agents',int(agentCount.total))+kpi('tm','Active agents with production',int(act.size),'In this period');}
  return '<div class="kpis">'+h+'</div>';
}

/* ---------- records table and activity lists ---------- */
function recTable(rows,o){
  o=o||{};const m=o.module;
  if(!rows.length)return empty('No records match','Change the period or filters, or add a record.');
  const sorted=rows.slice().sort((a,b)=>a.date===b.date?(a.submittedAt<b.submittedAt?1:-1):(a.date<b.date?1:-1));
  const sts=m==='UT'?UT_STATUS:m==='TK'?TK_STATUS:RC_STATUS;
  const th=m==='UT'?'<th>Category</th><th>Fund</th><th class="r">Amount</th><th class="r">Monthly</th>':m==='TK'?'<th>Product</th><th class="r">FYAC</th><th class="r">FYCC</th>':'<th>Name</th><th>Category</th>';
  const body=sorted.slice(0,o.limit||300).map(x=>{
    const key=esc(x.agentId+'|'+x.id);
    let mid='';
    if(m==='UT')mid='<td>'+esc((UT_CATS.find(c=>c.v===x.category)||{}).l||x.category)+'</td><td>'+(x.fund&&x.fund.trim()?esc(x.fund):'<span class="hint" title="No fund entered. Reports use the sales category.">'+esc(fundLabel(x))+' (by type)</span>')+'</td><td class="r num">'+rm(x.amount)+'</td><td class="r num">'+(x.category==='rsp'?rm(x.monthlyContribution):'–')+'</td>';
    else if(m==='TK')mid='<td>'+esc(x.product)+'</td><td class="r num">'+rm(x.fyac)+'</td><td class="r num">'+rm(x.fycc)+'</td>';
    else mid='<td>'+esc(x.name)+(x.status==='Existing Agent'?' '+pill('Existing',null,'hist'):'')+'</td><td>'+esc(x.category)+'</td>';
    const sel=o.canEdit?'<select data-status="'+key+'" aria-label="Status" style="width:auto;padding:4px 6px">'+sts.map(s=>'<option'+(s===x.status?' selected':'')+'>'+s+'</option>').join('')+'</select>':statusPill(x.status);
    return '<tr><td class="num" style="white-space:nowrap">'+fmtDate(x.date)+(x.historical?' <span class="hint" title="Entered after the transaction date">· back-dated</span>':'')+'</td>'+(o.agentCol?'<td>'+esc(nameOf(x.agentId))+'</td>':'')+mid+'<td>'+sel+'</td><td class="hint num" style="white-space:nowrap">'+fmtTs(x.submittedAt)+'</td>'+(o.canEdit?'<td style="white-space:nowrap"><button class="btn sm ghost" data-act="edit" data-v="'+key+'">Edit</button> <button class="btn sm danger" data-act="del" data-v="'+key+'">Delete</button></td>':'')+'</tr>';
  }).join('');
  return '<div class="tablewrap"><table><thead><tr><th>Date</th>'+(o.agentCol?'<th>Agent</th>':'')+th+'<th>Status</th><th>Submitted</th>'+(o.canEdit?'<th></th>':'')+'</tr></thead><tbody>'+body+'</tbody></table></div>'+(sorted.length>(o.limit||300)?'<div class="hint" style="margin-top:6px">Showing the latest '+(o.limit||300)+' of '+sorted.length+'. Narrow the filters to see the rest.</div>':'');
}
function feedRow(x,showName){
  const dot=x.module==='UT'?'var(--c1)':x.module==='TK'?'var(--c3)':'var(--c4)';
  let title,amt='';
  if(x.module==='UT'){title='Unit Trust · '+((UT_CATS.find(c=>c.v===x.category)||{}).l||x.category)+(x.fund&&x.fund.trim()?' · '+esc(x.fund):'');amt=rm(x.amount)+(x.category==='rsp'&&x.monthlyContribution?' + '+rm(x.monthlyContribution)+' per month':'');}
  else if(x.module==='TK'){title='Takaful · '+esc(x.product);amt='FYAC '+rm(x.fyac)+' · FYCC '+rm(x.fycc);}
  else{title='Recruitment · '+esc(x.category)+' · '+esc(x.name);}
  return '<div class="it"><span class="dot" style="background:'+dot+'"></span><div><div>'+(showName?'<b>'+esc(nameOf(x.agentId))+'</b> · ':'')+title+'</div><div class="m">'+(amt?'<span class="num">'+amt+'</span> · ':'')+'Transaction date '+fmtDate(x.date)+' · submitted '+fmtTs(x.submittedAt)+(x.historical?' · back-dated':'')+'</div></div><div>'+statusPill(x.status)+'</div></div>';

/* ---------- agent views ---------- */
function setupBanner(p){
  const mods=[];if(hasRHB(p))mods.push(['ut','Unit Trust','UT']);if(hasHLMT(p))mods.push(['tk','Takaful','TK']);mods.push(['rc','Recruitment','RC']);
  const st=p.setup||{};if(mods.every(m=>st[m[0]]==='completed'))return '';
  return '<div class="notice warn"><b>Initial setup</b> · enter every sale and recruit from 1 January '+new Date().getFullYear()+' to today, using their original dates. Progress is for tracking only and does not change any totals.<div class="stepper" style="margin-top:8px">'+mods.map(m=>'<span class="st"><b>'+m[1]+'</b> '+pill(SETUP_L[st[m[0]]||'not_started'],st[m[0]]==='completed'?'var(--good)':st[m[0]]==='in_progress'?'var(--warn)':'var(--muted)')+' <button class="btn sm ghost" data-act="add" data-v="'+m[2]+'">Add</button></span>').join('')+'</div></div>';

function agentView(){
  const v=S.view,p=S.profile;

  if(v==='pr')return prospectsView(false);

  return pageHead('Hello, '+p.fullName.split(' ')[0],'Your production, calculated from the records you have saved. '+liveTag(),addButtons(p))+
    setupBanner(p)+(S.myAdmin&&S.myAdmin.status==='inactive'?'<div class="notice warn">Your account is marked inactive by the leader.</div>':'')+
    reminderCard()+periodBar('')+kpiStrip(ids,r,p)+targetCard(S.uid,ids,r,false)+
    (hasRHB(p)?utPanel(ids,r,false):'')+(hasHLMT(p)?tkPanel(ids,r,false):'')+rcPanel(ids,r,false)+
    card('Recent activity','Your latest submissions, newest first',recent.length?'<div class="feed">'+recent.map(x=>feedRow(x,false)).join('')+'</div>':empty('No records yet','Add your first sale or recruit to start your dashboard.',addButtons(p)));

function moduleTab(m){
  const p=S.profile,r=R(),f=S.rep;
  let rows=rowsOf([S.uid],m,r);
  rows=applyFilters(rows,m,f);
  const allowed=m==='RC'||(m==='UT'&&hasRHB(p))||(m==='TK'&&hasHLMT(p));
  if(!allowed)return empty('Not available','This module is not part of your business affiliation.');
  return pageHead(modTitle(m)+' records',m==='UT'?'RHB Asset Management':m==='TK'?'Hong Leong MSIG Takaful':'RHB and HLMT',
      '<button class="btn" data-act="add" data-v="'+m+'">+ Add record</button><button class="btn ghost" data-act="export" data-v="mine">Export CSV</button>')+
    (setupBanner(p).includes(modTitle(m))?setupBanner(p):'')+periodBar('')+fundNote(m)+filterBar(m,false)+
    card('','',recTable(rows,{module:m,canEdit:true}));
}
function applyFilters(rows,m,f){
  const q=(f.q||'').trim().toLowerCase();
  return rows.filter(x=>(f.agent==='all'||!f.agent||x.agentId===f.agent)&&(f.cat==='all'||!f.cat||x.category===f.cat)&&(f.status==='all'||!f.status||x.status===f.status)&&(!q||[x.fund,x.product,x.name,x.notes,x.category].join(' ').toLowerCase().includes(q)));
}
function filterBar(m,leader){
  const f=S.rep,cats=m==='UT'?UT_CATS.map(c=>[c.v,c.l]):m==='RC'?[['RHB','RHB'],['HLMT','HLMT']]:null;
  const sts=m==='UT'?UT_STATUS:m==='TK'?TK_STATUS:RC_STATUS;

    '<label class="f" for="fq">Search<input id="fq" type="search" data-set="rep.q" value="'+esc(f.q)+'" placeholder="'+(m==='UT'?'Fund or notes':m==='TK'?'Product or notes':'Name or notes')+'"></label>'+

    (cats?'<label class="f" for="fc">'+(m==='UT'?'Sales category':'Recruitment category')+'<select id="fc" data-set="rep.cat"><option value="all">All</option>'+cats.map(c=>'<option value="'+c[0]+'"'+(f.cat===c[0]?' selected':'')+'>'+esc(c[1])+'</option>').join('')+'</select></label>':'')+
    '<label class="f" for="fs">Status<select id="fs" data-set="rep.status"><option value="all">All</option>'+sts.map(s=>'<option'+(f.status===s?' selected':'')+'>'+s+'</option>').join('')+'</select></label></div></div>';
}
function profileView(){
  const p=S.profile,st=p.setup||{};

/* ---------- dates, reminders ---------- */
const diffDays=(a,b)=>Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/864e5);
const plusDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d);};
const relDays=n=>n===0?'Today':n===1?'Tomorrow':'in '+n+' days';
const validPhone=p=>{const d=String(p||'').replace(/\D/g,'');return d.length>=9&&d.length<=13;};
const clientRows=uids=>{const o=[];for(const u of uids)for(const x of (S.items[u]||[]))if(x.module==='CL')o.push(x);return o;};
function reminders(uids){
  const out=[],t=todayStr();
  for(const x of clientRows(uids)){
    [['nextApptDate','Appointment'],['nextEpfDate','EPF investment']].forEach(([k,l])=>{
      const d=x[k];if(!d)return;const n=diffDays(d,t);
      if(n>=0&&n<=14)out.push({id:x.id,agentId:x.agentId,name:x.fullName,kind:l,date:d,days:n});
    });
  }
  return out.sort((a,b)=>a.days-b.days||(a.name<b.name?-1:1));
}
function reminderList(list,showAgent){
  return '<div class="feed">'+list.map(x=>'<div class="it"><span class="dot" style="background:'+(x.kind==='Appointment'?'var(--c1)':'var(--c3)')+'"></span><div><div><b>'+esc(x.name)+'</b> · '+(x.kind==='Appointment'?'Next appointment':'Next EPF investment')+'</div><div class="m">'+(showAgent?esc(nameOf(x.agentId))+' · ':'')+fmtDate(x.date)+'</div></div><div>'+pill(relDays(x.days),x.days<=3?'var(--warn)':'var(--c1)')+'</div></div>').join('')+'</div>';
}
function reminderCard(){
  const list=reminders([S.uid]),has=clientRows([S.uid]).length>0;
  return card('Reminders · next 14 days','Client appointments and EPF investment dates. A reminder appears 2 weeks ahead and stays until the date passes.',
    list.length?reminderList(list,false):empty(has?'Nothing due in the next 2 weeks':'No clients yet',has?'Set a next appointment or EPF date on a client to be reminded 2 weeks before.':'Add a client with their next appointment date to get reminders.','<button class="btn sm" data-act="add" data-v="CL">+ Add client</button>'));

async function submitClient(){
  const E=S.clientEdit;if(!E)return;
  const f=$('#clientform'),v=id=>f.querySelector('#'+id).value,err=t=>{$('#c_err').textContent=t;};
  const name=v('c_name').trim().replace(/\s+/g,' '),ic=v('c_ic').replace(/[\s-]/g,''),tin=v('c_tin').trim().toUpperCase(),email=v('c_email').trim().toLowerCase(),phone=v('c_phone').trim();
  if(name.length<2)return err('Enter the client’s full name.');
  if(ic&&!/^\d{12}$/.test(ic))return err('The IC number must be 12 digits.');
  if(tin&&!/^[A-Z0-9-]{4,20}$/.test(tin))return err('Check the TIN number. Use letters and numbers only.');
  if(email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return err('Enter a valid email address.');
  if(phone&&!validPhone(phone))return err('Enter a valid phone number.');
  const portfolio={};
  for(const p of PF){const t=v('c_'+p[0]).trim();if(t===''){portfolio[p[0]]=0;continue;}const n=r2(t);if(!(n>=0)||n>1e10)return err('Enter a valid amount for '+p[1]+'.');portfolio[p[0]]=n;}
  const key=name.toLowerCase(),digits=phone.replace(/\D/g,'');
  if(clientRows([S.uid]).some(x=>x.id!==E.id&&x.nameKey===key&&String(x.phone||'').replace(/\D/g,'')===digits))return err('You already have a client with this name and phone number. Edit that record instead.');
  const now=iso(),old=E.id?findItem(S.uid,E.id):null;
  if(E.id&&!old)return err('This client no longer exists.');
  const rec=Object.assign({},old||{id:uid22(),agentId:S.uid,module:'CL',date:todayStr(),submittedAt:now,createdAt:now,schemaVersion:1},{fullName:name,nameKey:key,icMasked:ic?'******-**-'+ic.slice(8):'',email,phone,portfolio,nextEpfDate:v('c_epfdate'),nextApptDate:v('c_appt'),notes:v('c_notes').trim().slice(0,1000),updatedAt:now});
  const btn=f.querySelector('button[type=submit]');btn.disabled=true;
  const ok=await safe(async()=>{await itemsCol(S.uid).doc(rec.id).set(rec);localPut(S.uid,rec);await S.db.doc('data/users/'+S.uid+'/secure/clients/'+rec.id).set({ic,tin,homeAddress:v('c_home').trim().slice(0,300),officeAddress:v('c_office').trim().slice(0,300),updatedAt:now});});
  btn.disabled=false;if(!ok)return;
  const t=todayStr(),msgs=[];
  [[rec.nextApptDate,'appointment'],[rec.nextEpfDate,'EPF investment']].forEach(([d,l])=>{if(!d)return;const n=diffDays(d,t);if(n>14)msgs.push('You will be reminded of the '+l+' on '+fmtDate(plusDays(d,-14))+'.');else if(n>=0)msgs.push('The '+l+' is within 2 weeks, so it is in your reminders now.');});
  toast('Client saved. '+msgs.join(' '));closeModal();
}

async function submitProspect(again){
  const E=S.prospEdit;if(!E)return;
  const f=$('#prospform'),v=id=>f.querySelector('#'+id).value,err=t=>{$('#q_err').textContent=t;};
  const source=v('q_src'),name=v('q_name').trim().replace(/\s+/g,' '),phone=v('q_phone').trim(),referrer=v('q_ref').trim().replace(/\s+/g,' '),eventName=v('q_event').trim().replace(/\s+/g,' '),date=v('q_date')||todayStr();
  if(name.length<2)return err('Enter the prospect’s name.');
  if(phone&&!validPhone(phone))return err('Enter a valid phone number.');
  if(source==='referral'&&!referrer)return err('Enter who referred this person.');
  if(source==='event'&&!eventName)return err('Enter the event name.');
  if(date>todayStr())return err('The date cannot be in the future.');
  const key=name.toLowerCase(),digits=phone.replace(/\D/g,'');
  if((S.items[S.uid]||[]).some(x=>x.module==='PR'&&x.id!==E.id&&x.nameKey===key&&String(x.phone||'').replace(/\D/g,'')===digits))return err('This prospect is already on your list. Edit that record instead.');
  const now=iso(),old=E.id?findItem(S.uid,E.id):null;
  if(E.id&&!old)return err('This prospect no longer exists.');
  const rec=Object.assign({},old||{id:uid22(),agentId:S.uid,module:'PR',submittedAt:now,createdAt:now,schemaVersion:1},{source,name,nameKey:key,phone,referrer:source==='referral'?referrer:'',eventName:source==='event'?eventName:'',date,notes:v('q_notes').trim().slice(0,500),updatedAt:now});
  const btns=f.querySelectorAll('button');btns.forEach(b=>{b.disabled=true;});
  const ok=await safe(async()=>{await itemsCol(S.uid).doc(rec.id).set(rec);localPut(S.uid,rec);});
  btns.forEach(b=>{b.disabled=false;});if(!ok)return;
  toast(E.id?'Prospect updated':'Prospect saved');
  if(again&&!E.id){['q_name','q_phone','q_notes'].forEach(id=>{f.querySelector('#'+id).value='';});$('#q_err').textContent='';f.querySelector('#q_name').focus();}else closeModal();
}

async function saveList(docId,taId,label,max){
  const el=$('#'+taId);if(!el)return;
  const seen=new Set(),list=[];
  el.value.split(/\r?\n/).forEach(l=>{const t=l.trim().replace(/\s+/g,' ').slice(0,80);if(t&&!seen.has(t.toLowerCase())){seen.add(t.toLowerCase());list.push(t);}});
  if(list.length>max)return toast('The list is limited to '+max+' items.','bad');
  const ok=await safe(()=>S.db.doc('settings/'+docId).set({list,updatedAt:iso()}));
  if(ok)toast(label+' saved ('+list.length+')');
}

async function submitEntry(again){
  const E=S.entry;if(!E)return;
  const f=$('#entryform'),v=id=>{const n=f.querySelector('#'+id);return n?n.value:'';},err=t=>{$('#f_err').textContent=t;};
  const date=v('f_date');
  if(!date)return err('Enter the date.');
  if(date>todayStr())return err('The date cannot be in the future.');
  if(!E.id&&date<new Date().getFullYear()+'-01-01')return err('Dates start from 1 January this year.');
  const notes=v('f_notes').trim().slice(0,500);let data;
  if(E.module==='UT'){
    const category=v('f_cat'),fund=v('f_fund').trim().replace(/\s+/g,' ').slice(0,80),amount=r2(v('f_amt')),mon=r2(v('f_mon'));
    if(!(amount>=0)||amount>1e9)return err('Enter a valid investment amount.');
    if(category!=='rsp'&&amount<=0)return err('The investment amount must be more than zero.');
    if(category==='rsp'&&!(mon>0))return err('Enter the RSP monthly contribution.');
    data={category,fund,amount,monthlyContribution:category==='rsp'?mon:0,status:v('f_status')};
  }else if(E.module==='TK'){
    const product=v('f_prod').trim(),fyac=r2(v('f_fyac')),fycc=r2(v('f_fycc'));
    if(!product)return err('Enter the Takaful product.');
    if(!(fyac>=0)||!(fycc>=0)||fyac>1e9||fycc>1e9)return err('Enter valid FYAC and FYCC amounts.');
    if(fyac<=0&&fycc<=0)return err('Enter FYAC or FYCC. They are recorded separately.');
    data={product,fyac,fycc,status:v('f_status')};
  }else{
    const name=v('f_name').trim().replace(/\s+/g,' '),category=v('f_cat');
    if(name.length<2)return err('Enter the recruit’s name.');
    const key=name.toLowerCase();
    if((S.items[E.uid]||[]).some(x=>x.module==='RC'&&x.category===category&&x.nameKey===key&&x.id!==E.id))return err('This person is already recorded under '+category+'. Edit that record to change their status.');
    data={name,nameKey:key,category,status:v('f_status')};
  }
  const now=iso();let rec;
  if(E.id){
    const old=findItem(E.uid,E.id);if(!old)return err('This record no longer exists.');
    rec=Object.assign({},old,data,{date,notes,updatedAt:now});
    if(old.status!==data.status)rec.history=(old.history||[]).concat([{at:now,by:S.uid,field:'status',from:old.status,to:data.status}]);
  }else{
    rec=Object.assign({id:uid22(),agentId:E.uid,module:E.module,date,notes,submittedAt:now,createdAt:now,updatedAt:now,historical:date<todayStr(),schemaVersion:1,history:[{at:now,by:S.uid,field:'status',from:null,to:data.status}]},data);
  }
  const btns=f.querySelectorAll('button');btns.forEach(b=>{b.disabled=true;});
  const ok=await safe(async()=>{await itemsCol(E.uid).doc(rec.id).set(rec);localPut(E.uid,rec);});
  btns.forEach(b=>{b.disabled=false;});
  if(!ok)return;
  if(!E.id&&E.uid===S.uid&&S.profile){const k=E.module.toLowerCase(),cur=(S.profile.setup||{})[E.module==='UT'?'ut':E.module==='TK'?'tk':'rc'];const sk=E.module==='UT'?'ut':E.module==='TK'?'tk':'rc';if(!cur||cur==='not_started'){safe(()=>S.db.doc('agents/'+S.uid).update({setup:{[sk]:'in_progress'}}));}}
  toast(E.id?'Record updated':'Saved: '+modTitle(E.module)+' record');
  if(again&&!E.id){['f_amt','f_mon','f_notes','f_name','f_fyac','f_fycc'].forEach(id=>{const n=f.querySelector('#'+id);if(n)n.value='';});$('#f_err').textContent='';const first=f.querySelector('#f_fund,#f_prod,#f_name');if(first)first.focus();}
  else closeModal();
}

const cleanCode=c=>String(c||'').trim().toUpperCase();
const validCode=c=>/^[A-Z0-9_-]{3,20}$/.test(c);
async function submitReg(){
  const f=$('#regform'),g=id=>f.querySelector('#'+id),err=t=>{g('r_err').textContent=t;};
  const name=g('r_name').value.trim().replace(/\s+/g,' '),ic=g('r_ic').value.replace(/[\s-]/g,''),email=g('r_email').value.trim().toLowerCase();
  const affEl=f.querySelector('input[name=aff]:checked'),aff=affEl?affEl.value:'',phone=g('r_phone').value.trim(),upline=g('r_upline').value.trim().replace(/\s+/g,' ').slice(0,80);
  if(name.length<2)return err('Enter your full name.');
  if(!/^\d{12}$/.test(ic)||+ic.slice(2,4)<1||+ic.slice(2,4)>12||+ic.slice(4,6)<1||+ic.slice(4,6)>31)return err('Enter a valid 12-digit Malaysian IC number.');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return err('Enter a valid email address.');
  if(!validPhone(phone))return err('Enter your mobile number, for example 012-3456789.');
  if(!aff)return err('Choose your business affiliation.');
  const biz=(k,on)=>{if(!on)return null;const pend=g('r_'+k+'pend').checked,code=cleanCode(g('r_'+k+'code').value);return {code:pend?'':code,codeStatus:pend?'pending':'provided',ranking:g('r_'+k+'rank').value};};
  const rhb=biz('rhb',aff!=='HLMT'),hlmt=biz('hlmt',aff!=='RHB');
  for(const [b,x] of [['RHB',rhb],['HLMT',hlmt]])if(x&&x.codeStatus==='provided'&&!validCode(x.code))return err('Enter your '+b+' agent code (3 to 20 letters or numbers), or tick “code pending”.');
  if(!g('r_consent').checked)return err('Please tick the consent box to continue.');
  const btn=g('r_go');btn.disabled=true;err('');
  const fail=t=>{err(t);btn.disabled=false;};
  try{
    const claims=[['ic_'+await sha('ic:'+ic),'An agent profile already exists for this IC number.'],['em_'+await sha('em:'+email),'This email address is already registered.']];
    if(rhb&&rhb.code)claims.push([codeKey('RHB',rhb.code),'This RHB agent code is already registered to another agent. Check it, or tick “code pending”.']);
    if(hlmt&&hlmt.code)claims.push([codeKey('HLMT',hlmt.code),'This HLMT agent code is already registered to another agent. Check it, or tick “code pending”.']);
    for(const [k,m] of claims){const c=await claim(k,S.uid);if(!c.ok)return fail(c.busy?'Someone else is registering the same details right now. Wait a moment and try again.':m);}
    const now=iso(),hist=[];
    [['RHB',rhb],['HLMT',hlmt]].forEach(([b,x])=>{if(x&&x.ranking!=='NA')hist.push({business:b,from:'NA',to:x.ranking,effectiveDate:todayStr(),changedAt:now,changedBy:S.uid});});
    await S.db.doc('data/users/'+S.uid+'/secure').set({ic,consentAt:now,notice:'v1'});
    await S.db.doc('agents/'+S.uid).set({uid:S.uid,fullName:name,email,phone,uplineName:upline,icMasked:'******-**-'+ic.slice(8),affiliation:aff,rhb,hlmt,rankingHistory:hist,setup:{ut:'not_started',tk:'not_started',rc:'not_started'},consentAt:now,registeredAt:now,updatedAt:now,schemaVersion:1});
    toast('Profile created. Welcome, '+name.split(' ')[0]+'.');S.view='dash';S.ownerView=S.isOwner?'agent':S.ownerView;
  }catch(e){console.error(e);fail((e&&e.message)||'Could not save. Try again.');}
}

async function saveTargets(){

  if(kind==='module'){const mm=m||S.rep.module,[h,b]=moduleRows(mm,applyFilters(rowsOf(Object.keys(S.agents),mm,r),mm,S.rep));return exportCsv(modTitle(mm).toLowerCase()+'-report',h,b);}
  if(kind==='dir'){const y=new Date().getFullYear()+'-01-01',yr={from:y,to:todayStr()};
    return exportCsv('agent-directory',['Name','Email','Mobile','Upline','IC (masked)','Business','RHB code','RHB ranking','HLMT code','HLMT ranking','Registered','Account status','UT sales YTD (RM)','FYAC YTD (RM)','FYCC YTD (RM)','RHB recruits YTD','HLMT recruits YTD'],
      dirRows().map(x=>{const p=x.p,s=agentSummary(x.u,yr);return [p.fullName,p.email,p.phone||'',p.uplineName||'',p.icMasked,affLabel(p.affiliation),p.rhb?(p.rhb.code||'Pending'):'',p.rhb?rankLabel('RHB',p.rhb.ranking):'',p.hlmt?(p.hlmt.code||'Pending'):'',p.hlmt?rankLabel('HLMT',p.hlmt.ranking):'',p.registeredAt,x.st,s.ut.total,s.tk.fyac,s.tk.fycc,s.rc.cat.RHB,s.rc.cat.HLMT];}));}
  if(kind==='clients'){const uids=mode()==='agent'?[S.uid]:Object.keys(S.agents);
    return exportCsv('clients',['Agent','Client name','IC (masked)','Email','Phone','Cash (RM)','EPF/KWSP (RM)','PRS (RM)','RSP (RM)','Takaful (RM)','Next EPF investment date','Next proposed appointment','Notes'],
      clientRows(uids).sort((a,b)=>a.fullName.toLowerCase()<b.fullName.toLowerCase()?-1:1).map(x=>{const pf=x.portfolio||{};return [nameOf(x.agentId),x.fullName,x.icMasked,x.email,x.phone,pf.cash||0,pf.epf||0,pf.prs||0,pf.rsp||0,pf.takaful||0,x.nextEpfDate,x.nextApptDate,x.notes];}));}
  if(kind==='prospects'){const uids=mode()==='agent'?[S.uid]:Object.keys(S.agents),o=[];uids.forEach(u=>(S.items[u]||[]).forEach(x=>{if(x.module==='PR')o.push(x);}));
    return exportCsv('prospects',['Agent','Source','Prospect name','Phone','Referrer','Event','Date','Notes'],o.sort((a,b)=>a.date<b.date?1:-1).map(x=>[nameOf(x.agentId),SRC_L[x.source]||x.source,x.name,x.phone,x.referrer,x.eventName,x.date,x.notes]));}
  if(kind==='team')return exportCsv('team-performance',PERF_H,Object.keys(S.agents).map(perfRow));
  if(kind==='indiv'){const u=S.rep.expAgent;if(!u||!S.agents[u])return toast('Choose an agent first.','bad');return exportCsv('agent-performance-'+nameOf(u).toLowerCase().replace(/[^a-z0-9]+/g,'-'),PERF_H,[perfRow(u)]);}
}

/* ---------- demo data ---------- */
function seeded(n){let s=n;return ()=>{s=(s*16807)%2147483647;return (s-1)/2147483646;};}
async function loadDemo(){
  if(S.busy)return;S.busy=true;schedule();toast('Loading sample data…');
  const rnd=seeded(42),pick=a=>a[Math.floor(rnd()*a.length)],now=new Date(),cm=now.getMonth(),defs=[
    ['aisyah','Aisyah Rahman','RHB',{ranking:'GAM'},null],['hakim','Hakim Ismail','HLMT',null,{ranking:'CTC'}],['nurul','Nurul Huda','BOTH',{ranking:'AM'},{ranking:'MTC'}],['farid','Farid Ahmad','RHB',{ranking:'UTC'},null]];
  const funds=['Demo Growth Fund','Demo Income Fund','Demo Balanced Fund','Demo Sukuk Fund'],prods=['Demo Medical Plan','Demo Life Plan','Demo Family Plan'];
  const writes=[];
  for(const [slug,nm,aff,rh,hl] of defs){
    const uid='demo_'+slug,regAt=iso();
    writes.push(()=>S.db.doc('agents/'+uid).set({uid,fullName:'Demo · '+nm,email:slug+'@example.invalid',icMasked:'******-**-0000',affiliation:aff,rhb:rh?{code:'DEMO-R-'+slug.toUpperCase(),codeStatus:'provided',ranking:rh.ranking}:null,hlmt:hl?{code:'DEMO-H-'+slug.toUpperCase(),codeStatus:'provided',ranking:hl.ranking}:null,rankingHistory:[],setup:{ut:'completed',tk:'completed',rc:'completed'},registeredAt:regAt,updatedAt:regAt,demo:true,schemaVersion:1}));
    const mk=(module,date,data)=>{const id='d'+Math.random().toString(36).slice(2,10);const rec=Object.assign({id,agentId:uid,module,date,notes:'Demo record',submittedAt:iso(),createdAt:iso(),updatedAt:iso(),historical:date<todayStr(),demo:true,schemaVersion:1,history:[]},data);writes.push(()=>itemsCol(uid).doc(id).set(rec));};
    for(let m=0;m<=cm;m++){
      const maxD=m===cm?Math.max(1,now.getDate()):28,day=()=>pad(1+Math.floor(rnd()*maxD)),dt=()=>now.getFullYear()+'-'+pad(m+1)+'-'+day();
      if(rh)for(let i=0;i<2+Math.floor(rnd()*2);i++){const cat=pick(['cash','epf','prs','rsp','cash']);mk('UT',dt(),{category:cat,fund:rnd()>.25?pick(funds):'',amount:r2(5000+rnd()*70000),monthlyContribution:cat==='rsp'?r2(200+rnd()*1200):0,status:pick(['Disbursed','Disbursed','Submit','Rejected'])});}
      if(hl)for(let i=0;i<2;i++){const ac=r2(1200+rnd()*8000);mk('TK',dt(),{product:pick(prods),fyac:ac,fycc:r2(ac*(.4+rnd()*.3)),status:pick(['Inforced','Inforced','Submitted','Pending'])});}
    }
    const cats=aff==='BOTH'?['RHB','HLMT']:[aff];
    ['Alya Nasir','Zul Karim','Mei Ling','Hafsah Omar'].slice(0,2+Math.floor(rnd()*3)).forEach((n,i)=>{const nm2=n+' (demo '+slug+')';mk('RC',now.getFullYear()+'-'+pad(1+Math.floor(rnd()*(cm+1)))+'-'+pad(1+Math.floor(rnd()*(cm===now.getMonth()?Math.max(1,Math.min(28,now.getDate())):28))),{name:nm2,nameKey:nm2.toLowerCase(),category:pick(cats),status:pick(RC_STATUS)});});
    const dp=n=>plusDays(todayStr(),n);
    [['Demo Client One',5,10],['Demo Client Two',30,45]].forEach(([cn,a,e],i)=>{const nm3=cn+' ('+slug+')';mk('CL',todayStr(),{fullName:nm3,nameKey:nm3.toLowerCase(),icMasked:'******-**-0000',email:'client'+i+'.'+slug+'@example.invalid',phone:'012-30000'+i+'0',portfolio:{cash:r2(10000+rnd()*50000),epf:r2(20000+rnd()*80000),prs:r2(rnd()*20000),rsp:r2(rnd()*15000),takaful:r2(rnd()*8000)},nextApptDate:dp(a),nextEpfDate:dp(e)});});
    [['referral','Demo Referral',''],['event','Demo Event Lead','Demo Investment Talk']].forEach(([src,pn,evn],i)=>{const nm4=pn+' ('+slug+')';mk('PR',todayStr(),{source:src,name:nm4,nameKey:nm4.toLowerCase(),phone:'013-40000'+i+'0',referrer:src==='referral'?'Demo Referrer':'',eventName:evn});});
  }
  // keep rows within today
  const ok=await safe(async()=>{for(let i=0;i<writes.length;i+=6)await Promise.all(writes.slice(i,i+6).map(w=>w()));});
  S.busy=false;schedule();if(ok)toast('Sample data loaded. Remove it any time from the Overview.');
}
async function removeDemo(){
  if(S.busy)return;S.busy=true;schedule();
  const ids=Object.keys(S.agents).filter(u=>S.agents[u].demo),dels=[];
  ids.forEach(u=>{(S.items[u]||[]).forEach(x=>dels.push(()=>itemsCol(u).doc(x.id).delete()));dels.push(()=>S.db.doc('agents/'+u).delete());dels.push(()=>S.db.doc('admin/'+u).delete());});
  await safe(async()=>{for(let i=0;i<dels.length;i+=6)await Promise.all(dels.slice(i,i+6).map(w=>w()));});
  S.busy=false;S.drill=null;schedule();toast('Demo data removed');
}

/* ---------- events ---------- */
function setPath(path,val){const ks=path.split('.');let o=S;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=val;}
function act(a,el){
  const v=el.dataset.v;
  switch(a){
    case 'nav':S.view=v;S.drill=null;S.bell=false;S.rep.q='';S.rep.cat='all';S.rep.status='all';S.rep.agent='all';render();window.scrollTo(0,0);break;
    case 'period':S.period.k=v;render();break;
    case 'drill':S.drill=v;S.bell=false;render();window.scrollTo(0,0);break;
    case 'back':S.drill=null;render();break;
    case 'ownerswitch':S.ownerView=v;S.view='';S.drill=null;render();window.scrollTo(0,0);break;
    case 'bell':S.bell=!S.bell;render();break;
    case 'bellread':safe(()=>S.db.doc('data/users/'+S.uid+'/leader').set({lastSeen:iso()}));S.bell=false;break;
    case 'add':if(v==='CL')openClient();else if(v==='PR')openProspect();else openEntry(v);break;
    case 'edit':{const [u,id]=v.split('|');const it=findItem(u,id);if(!it)break;if(it.module==='CL'){if(u===S.uid)openClient(id);}else if(it.module==='PR'){if(u===S.uid)openProspect(id);}else openEntry(it.module,u,id);break;}
    case 'prospectclient':{const [u,id]=v.split('|');const it=findItem(u,id);if(it&&u===S.uid)openClient(null,{fullName:it.name,phone:it.phone});break;}
    case 'savefunds':saveFunds();break;
    case 'saveproducts':saveProducts();break;
    case 'combopick':{const t=document.getElementById(el.dataset.for);if(t){t.value=el.dataset.v;filterCombo(t);t.focus();}break;}
    case 'del':{const [u,id]=v.split('|'),it=findItem(u,id);if(!it)break;S.del=v;openModal('<h2>Delete this record?</h2><p>'+esc(modTitle(it.module))+' record dated '+fmtDate(it.date)+' will be removed from all totals. This cannot be undone.</p><div class="acts"><button class="btn ghost" data-act="closemodal">Keep it</button><button class="btn danger" data-act="dodel">Delete record</button></div>');break;}
    case 'dodel':{const [u,id]=(S.del||'|').split('|'),it0=u&&id?findItem(u,id):null;closeModal();if(u&&id)safe(async()=>{await itemsCol(u).doc(id).delete();localDel(u,id);if(it0&&it0.module==='CL'&&u===S.uid)await S.db.doc('data/users/'+u+'/secure/clients/'+id).delete();}).then(ok=>{if(ok)toast('Record deleted');});break;}
    case 'closemodal':closeModal();break;
    case 'demoLoad':loadDemo();break;
    case 'demoRemove':removeDemo();break;
    case 'editprofile':openProfileEdit(v);break;
    case 'statustoggle':{const cur=(S.admin[v]&&S.admin[v].status)||'active';safe(()=>S.db.doc('admin/'+v).set({status:cur==='active'?'inactive':'active',updatedAt:iso()}));break;}
    case 'saveTargets':saveTargets();break;
    case 'repmod':S.rep.module=v;S.rep.cat='all';S.rep.status='all';render();break;
    case 'export':doExport(v,el.dataset.m);break;
    case 'exportAgent':S.rep.expAgent=v;doExport('indiv');break;
  }
}
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains('veil')){closeModal();return;}
  const b=t.closest('[data-act]');
  if(b){e.preventDefault();act(b.dataset.act,b);return;}
  const tr=t.closest('tr[data-open]');if(tr){S.drill=tr.dataset.open;render();window.scrollTo(0,0);return;}
  if(S.bell&&!t.closest('.panel')){S.bell=false;render();}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#modalroot').firstChild)closeModal();
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('tr[data-open]')){S.drill=e.target.dataset.open;render();window.scrollTo(0,0);}
});
const isText=el=>el.tagName==='INPUT'&&/^(text|search|email|number|)$/.test(el.type||'')||el.tagName==='TEXTAREA';
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.set&&isText(el)){setPath(el.dataset.set,el.value);render();}
  if(el.dataset&&el.dataset.combo)filterCombo(el);
  if(el.dataset&&el.dataset.tg){S.tgdraft=S.tgdraft||{};S.tgdraft[el.dataset.tg]=el.value;}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.set&&!isText(el)){if(el.dataset.set==='tmonth')S.tgdraft=null;setPath(el.dataset.set,el.value);render();return;}
  if(el.dataset&&el.dataset.status){const [u,id]=el.dataset.status.split('|');changeStatus(u,id,el.value);return;}
  if(el.dataset&&el.dataset.setup){safe(()=>S.db.doc('agents/'+S.uid).update({setup:{[el.dataset.setup]:el.value}}));return;}
  if(el.id==='f_cat'&&$('#f_monwrap'))$('#f_monwrap').hidden=el.value!=='rsp';
  if(el.id==='q_src'){const ev=el.value==='event';$('#q_refwrap').hidden=ev;$('#q_evwrap').hidden=!ev;$('#q_datelbl').firstChild.nodeValue=ev?'Event date':'Date received';}
  if(el.name==='aff'){const x=el.value;$('#blk_rhb').hidden=x==='HLMT';$('#blk_hlmt').hidden=x==='RHB';}
  if(el.id==='p_aff'){const x=el.value;$('#blk_rhb').hidden=x==='HLMT';$('#blk_hlmt').hidden=x==='RHB';}
  if(el.dataset&&el.dataset.pend){const c=document.getElementById('r_'+el.dataset.pend+'code');if(c){c.disabled=el.checked;if(el.checked)c.value='';}}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const id=e.target.id;
  if(id==='regform')submitReg();else if(id==='entryform')submitEntry(e.submitter&&e.submitter.value==='again');else if(id==='profform')submitProf();else if(id==='clientform')submitClient();else if(id==='prospform')submitProspect(e.submitter&&e.submitter.value==='again');
});
let rt=0;
window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{const c=$('#main .chart[data-cid]');if(c&&Math.abs((c.getBoundingClientRect().width|0)-(+c.dataset.w||0))>8)mountCharts($('#main'));},160);});

/* ---------- boot ---------- */
async function boot(){
  const cl=window.claude;
  if(!cl||!cl.use){S.gate={title:'Open this page from Claude',msg:'The shared database is only available when the page is opened from its Claude link.'};render();return;}
  try{
    const [db,user,dl]=await Promise.all([cl.use('db'),cl.use('user'),cl.use('downloads')]);
    if(!db||!user){S.gate={title:'Sign in to continue',msg:'Sign in to Claude and open the link the team leader shared with you.'};render();return;}
    S.db=db;S.dl=dl;S.uid=await user.id();S.isOwner=await user.isOwner();S.canWrite=await user.can('data.write');
    if(!S.uid){S.gate={title:'Sign in to continue',msg:'Sign in to Claude and open the link the team leader shared with you.'};render();return;}
    startMine();if(S.isOwner)startLeader();setInterval(pullAll,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pullAll();});
  }catch(e){console.error(e);S.gate={title:'Could not connect',msg:(e&&e.message)||'Reload the page and try again.'};render();}
}
render();boot();
})();
